<section class="section" id="contacto" aria-labelledby="contacto-title">
  <div class="container panel glass contact-panel reveal">
    <div class="contact-intro">
      <span class="panel-tag">// contacto</span>
      <h2 id="contacto-title">Hablemos de tu proyecto</h2>
      <p>Rellena el formulario o escríbenos directamente. Respondemos en menos de 24 horas.</p>
      <ul class="contact-info">
        <li class="contact-info-item">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="2" y="4" width="16" height="12" rx="2" stroke="var(--accent)" stroke-width="1.5"/>
            <path d="M2 6l8 5 8-5" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <a href="mailto:hola@furnabit.com">hola@furnabit.com</a>
        </li>
        <li class="contact-info-item">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M10 2a6.5 6.5 0 0 1 6.5 6.5c0 4.5-6.5 9.5-6.5 9.5s-6.5-5-6.5-9.5A6.5 6.5 0 0 1 10 2z" stroke="var(--accent)" stroke-width="1.5"/>
            <circle cx="10" cy="8.5" r="2" stroke="var(--accent)" stroke-width="1.5"/>
          </svg>
          <span>España · Remoto</span>
        </li>
      </ul>
    </div>

    <form class="contact-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Tu nombre" required/>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" required/>
      </div>
      <div class="form-group">
        <label for="message">Cuéntanos tu proyecto</label>
        <textarea id="message" [(ngModel)]="message" name="message" rows="4" placeholder="Describe brevemente qué necesitas" required></textarea>
      </div>
      <button class="button button-primary" type="submit">
        Enviar mensaje
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M14 2L7 9M14 2l-5 12-2-5-5-2 12-5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p [class.success]="formMessageType() === 'success'" [class.error]="formMessageType() === 'error'" class="form-message" role="status" aria-live="polite">
        {{ formMessage() }}
      </p>
    </form>
  </div>
</section>
