<section class="section" id="servicios" aria-label="Servicios de Furnabit">
  <ul class="services-fullscreen">
    @for (cap of capabilities; track cap.title; let i = $index) {
      <li class="service-slide">
        <div class="service-slide-inner">
          <span class="service-slide-tag">// 0{{ i + 1 }} · 0{{ capabilities.length }}</span>
          <h3>{{ cap.title }}</h3>
          <p>{{ cap.description }}</p>
        </div>
        @if (i < capabilities.length - 1) {
          <span class="service-slide-hint" aria-hidden="true">scroll</span>
        }
      </li>
    }
  </ul>
</section>
