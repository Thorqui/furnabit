<section class="section" id="garantias" aria-labelledby="garantias-title">
  <div class="container">
    <div class="panel-head reveal">
      <span class="panel-tag">// por qué furnabit</span>
      <h2 id="garantias-title">Las respuestas a las dudas más habituales</h2>
      <p>Trabajar con una empresa de tecnología puede generar incertidumbre. Aquí están nuestros cuatro compromisos ante eso.</p>
    </div>

    <div class="guarantees-grid reveal">
      @for (g of guarantees; track g.title; let i = $index) {
        <div class="guarantee-card">
          <h3>{{ g.title }}</h3>
          <p>{{ g.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
