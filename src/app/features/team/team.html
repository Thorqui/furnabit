<section class="section" id="equipo" aria-labelledby="equipo-title">
  <div class="container panel glass reveal">
    <div class="panel-head">
      <span class="panel-tag">// equipo</span>
      <h2 id="equipo-title">Un equipo. Cero burocracia.</h2>
      <p>Especialistas en cada área, coordinados para entregar soluciones sin atajos. Cada miembro domina su disciplina y todos participan en cada proyecto.</p>
    </div>

    <ul class="team-grid">
      <li class="team-card" *ngFor="let member of members">
        <span class="team-avatar" aria-hidden="true">{{ member.avatar }}</span>
        <h3>{{ member.title }}</h3>
        <p class="team-role">{{ member.role }}</p>
        <p>{{ member.description }}</p>
      </li>
    </ul>
  </div>
</section>
