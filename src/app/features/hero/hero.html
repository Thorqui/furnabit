<section class="hero">
  <div class="container hero-inner" [attr.data-parallax]="0.18">
    <span class="live-chip" class="reveal">
      <span class="pulse-dot"></span>
      Aceptando proyectos
    </span>

    <h1 class="reveal">Construimos el <span class="text-accent">software</span><br>que tu negocio necesita.</h1>

    <p class="lead reveal">
      Un equipo especializado que diseña, desarrolla y despliega
      soluciones digitales a medida. Sin plantillas, sin atajos: código que funciona en producción.
    </p>

    <div class="hero-actions reveal">
      <a class="button button-primary" href="#contacto">
        Solicitar presupuesto
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <a class="button button-secondary" href="#servicios">Explorar servicios</a>
    </div>
  </div>

  <span class="scroll-cue reveal" aria-hidden="true">
    <span class="scroll-cue-line"></span>
    desplázate
  </span>
</section>
