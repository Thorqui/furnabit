<section class="section" id="proceso" aria-labelledby="proceso-title" style="height: 100vh;">
  <div class="container">
    <div class="panel-head reveal">
      <span class="panel-tag">// cómo trabajamos</span>
      <h2 id="proceso-title">Así trabajamos juntos, paso a paso</h2>
      <p>Un proceso claro de principio a fin para que sepas en todo momento en qué punto está tu proyecto.</p>
    </div>

    <ol class="process-timeline reveal">
      @for (step of steps; track step.number) {
        <li class="process-step">
          <span class="step-badge">{{ step.number }}</span>
          <h3>{{ step.title }}</h3>
          <p>{{ step.description }}</p>
        </li>
      }
    </ol>
  </div>
</section>
