<header class="site-header" [class.is-scrolled]="isScrolled()" id="top">
  <div class="container header-inner">
    <a href="#top" class="brand" aria-label="Furnabit, volver al inicio">
      <span class="brand-mark" aria-hidden="true">
        <img src="/furnabit-logo.png" alt="" width="25" height="25" />
      </span>
      <span class="brand-wordmark">Furnabit</span>
    </a>

    <div style="display:flex;align-items:center;gap:0.5rem;">
      <button
        class="theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="isDark() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'">
        <!-- Sun (shown in dark mode to switch to light) -->
        @if (isDark()) {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <line x1="12" y1="2"  x2="12" y2="4"/>
            <line x1="12" y1="20" x2="12" y2="22"/>
            <line x1="4.22" y1="4.22"   x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="2"  y1="12" x2="4"  y2="12"/>
            <line x1="20" y1="12" x2="22" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        }
        <!-- Moon (shown in light mode to switch to dark) -->
        @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>

      <button
        class="menu-toggle"
        id="menu-toggle"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? 'Cerrar navegación' : 'Abrir navegación'"
        (click)="toggleMenu()">
        <span></span>
        <span></span>
      </button>
    </div>

    <nav class="site-nav" [class.is-open]="menuOpen()" aria-label="Navegación principal">
      <ul class="nav-menu">
        <li><a href="#servicios" (click)="closeMenu()">Servicios</a></li>
        <li><a href="#proceso"   (click)="closeMenu()">Cómo trabajamos</a></li>
        <li><a href="#garantias" (click)="closeMenu()">Garantías</a></li>
        <li><a href="#equipo"    (click)="closeMenu()">Equipo</a></li>
        <li><a href="#contacto"  class="nav-cta" (click)="closeMenu()">Hablemos</a></li>
      </ul>
    </nav>
  </div>
</header>
